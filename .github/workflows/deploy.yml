name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Build Dashboard
        run: |
          cd dashboard
          npm ci
          npm run build

      - name: Deploy code to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/arbitragebot
            cp settings.json settings.json.bak 2>/dev/null || true
            git checkout -- settings.json 2>/dev/null || true
            git pull origin master
            cp settings.json.bak settings.json 2>/dev/null || true
            rm -f settings.json.bak
            cp scripts/arbitragebot.service /etc/systemd/system/arbitragebot.service
            systemctl daemon-reload
            .venv/bin/pip install -r requirements.txt --quiet

      - name: Upload built dashboard
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dashboard/dist/"
          target: "/root/arbitragebot/"
          overwrite: true

      - name: Restart bot
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            systemctl restart arbitragebot
            echo "Deploy complete, bot restarted"
